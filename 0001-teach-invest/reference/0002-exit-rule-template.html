<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参考卡：卖出纪律模板</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  body { font-size: 17px; }
  .page { max-width: 760px; }
  .field { margin-bottom: 1.1rem; }
  .field label { font-family: var(--sans); font-weight: 700; font-size: 0.85rem; color: var(--ink-soft); display: block; margin-bottom: 0.3rem; }
  .fill { border-bottom: 1px solid var(--rule); display: inline-block; min-width: 100%; height: 1.6em; }
  @media print {
    body { padding: 0.5rem; background: #fff; color: #000; }
    .no-print { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="kicker">参考卡 · Reference</div>
  <h1>卖出纪律模板</h1>
  <p class="lede">来自 <a href="../lessons/0002-anchoring-and-disposition-effect.html">课程 0002：锚定效应与处置效应</a>。规则要在<strong>买入前、情绪平静的时候</strong>写下来 —— 一旦持有过程中开始纠结，说明规则已经晚了。</p>

  <div class="callout warn">
    <div class="label">使用方法</div>
    每次买入一只股票/基金之前，先把这一页填完，再下单。价格触发后，24 小时内执行，不再重新评估"要不要再等等"。
  </div>

  <div class="field">
    <label>标的名称 / 买入价格 / 买入日期</label>
    <span class="fill"></span>
  </div>
  <div class="field">
    <label>当初的买入理由（一句话——如果写不出来，说明还没做够分析）</label>
    <span class="fill"></span>
  </div>
  <div class="field">
    <label>止盈规则：涨到什么价格 / 比例，卖出多少</label>
    <span class="fill"></span>
  </div>
  <div class="field">
    <label>止损规则：跌破什么价格 / 比例，无条件卖出</label>
    <span class="fill"></span>
  </div>
  <div class="field">
    <label>移动止盈（可选）：如果已经浮盈，从最高点回撤超过多少就卖出剩余仓位</label>
    <span class="fill"></span>
  </div>
  <div class="field">
    <label>什么情况会让原来的买入理由失效？（提前想好，避免"不认可自己犯错"）</label>
    <span class="fill"></span>
  </div>

  <div class="callout tip">
    <div class="label">为什么"移动止盈"特别有用</div>
    它把"历史最高点"从一个让你难受的心理锚，变成一个客观的触发条件（比如"回撤超过 20% 就卖"）。这样你不再需要在当下现场判断"要不要卖"——规则已经替你决定好了。
  </div>

  <div class="nav-footer no-print">
    <span>← <a href="../lessons/0002-anchoring-and-disposition-effect.html">返回课程 0002</a></span>
    <span>股票投资教学工作区</span>
  </div>
</div>
</body>
</html>
